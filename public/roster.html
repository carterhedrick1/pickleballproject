<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roster - IN or OUT</title>
    <link rel="stylesheet" href="/css/header.css">
    <link rel="stylesheet" href="/css/footer.css">
    <link rel="stylesheet" href="/css/host-pages.css">
    <link rel="stylesheet" href="/css/design-system.css">
</head>
<body class="page-host page-roster">
    <div class="container">
        <div class="page-header">
            <div class="header-content">
                <h1>Roster</h1>
            </div>
        </div>

        <div id="status" class="status" style="display: none;"></div>

        <div class="content-section">
            <div id="phoneGate" class="phone-gate" style="display: none;">
                <div id="phoneStep">
                    <h3>Verify Your Host Number</h3>
                    <p>We’ll text you a verification code.</p>
                    <input type="tel" id="phoneInput" placeholder="(555) 123-4567" autocomplete="tel">
                    <br>
                    <button type="button" class="btn btn-primary" id="sendCodeBtn">Send Verification Code</button>
                </div>
                <div id="codeStep" style="display: none;">
                    <h3>Enter Your Verification Code</h3>
                    <p id="codeHelp"></p>
                    <input type="text" id="codeInput" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="123456">
                    <br>
                    <button type="button" class="btn btn-primary" id="verifyCodeBtn">Verify And Continue</button>
                    <button type="button" class="switch-number" id="resendCodeBtn">Send A New Code</button>
                    <button type="button" class="switch-number" id="changeNumberBtn">Use A Different Number</button>
                </div>
            </div>

            <div id="rosterBody" style="display: none;">
                <p class="summary-line" id="summaryLine"></p>

                <div class="roster-row" id="rosterAdd">
                    <h3 class="section-subtitle">Add A Player</h3>
                    <label for="addPlayerName">Name</label>
                    <input type="text" id="addPlayerName" maxlength="100">
                    <label for="addPlayerPhone">Phone Number</label>
                    <input type="tel" id="addPlayerPhone" placeholder="(555) 123-4567" autocomplete="off">
                    <div class="card-actions" style="margin-top: 12px;">
                        <button type="button" class="btn btn-primary" id="addPlayerBtn">Add To Roster</button>
                    </div>
                    <div class="row-status" id="addPlayerStatus"></div>
                </div>

                <div id="rosterList"></div>

                <div id="emptyState" class="no-games" style="display: none;">
                    <h3>Nobody Yet</h3>
                    <p class="realist-line" id="emptyRealistLine" style="display: none;"></p>
                    <a href="/create.html" class="create-game-btn">Create A Game</a>
                </div>

                <p class="muted" style="margin-top: 28px;">
                    <span id="whichPhone"></span>
                    <button type="button" class="switch-number" id="switchNumber">Not You? Switch Number</button>
                </p>
            </div>
        </div>

        <div class="footer-note">
            Names you enter here are yours &mdash; players never see or edit them.
        </div>
    </div>

    <script type="module">
        import * as HostVerification from '/js/host-verification.js';

        let hostPhone = '';

        document.addEventListener('DOMContentLoaded', () => {
            HostVerification.init({
                contentId: 'rosterBody',
                switchButtonId: 'switchNumber',
                showStatus,
                onVerified: (phone) => {
                    hostPhone = phone;
                    return loadRoster();
                }
            });
        });

        function showStatus(message, type) {
            const el = document.getElementById('status');
            el.textContent = message;
            el.className = 'status ' + (type || 'info');
            el.style.display = message ? 'block' : 'none';
        }

        const prettyPhone = HostVerification.prettyPhone;

        document.getElementById('addPlayerBtn').addEventListener('click', addPlayerToRoster);

        async function addPlayerToRoster() {
            const nameInput = document.getElementById('addPlayerName');
            const phoneInput = document.getElementById('addPlayerPhone');
            const status = document.getElementById('addPlayerStatus');
            const button = document.getElementById('addPlayerBtn');

            const name = nameInput.value.trim();
            const phoneDigits = phoneInput.value.replace(/\D/g, '');

            if (!name) {
                status.style.color = 'var(--danger)';
                status.textContent = 'Please enter their name.';
                return;
            }
            if (phoneDigits.length < 10) {
                status.style.color = 'var(--danger)';
                status.textContent = 'Please enter a full phone number so we can text them.';
                return;
            }

            status.style.color = 'var(--text-muted)';
            status.textContent = 'Adding...';
            button.disabled = true;

            try {
                const response = await fetch(
                    `/api/roster/${hostPhone}/${encodeURIComponent(phoneDigits)}`,
                    {
                        method: 'PUT',
                        headers: HostVerification.authHeaders({ 'Content-Type': 'application/json' }),
                        body: JSON.stringify({ name })
                    }
                );
                const data = await response.json().catch(() => ({}));
                if (response.status === 401) {
                    HostVerification.expireSession();
                    return;
                }
                if (!response.ok) throw new Error(data.error || `Server returned ${response.status}`);

                nameInput.value = '';
                phoneInput.value = '';
                status.style.color = 'var(--brand)';
                status.textContent = `${data.player && data.player.name ? data.player.name : name} is on your roster.`;
                await loadRoster();
            } catch (error) {
                console.error('Error adding roster entry:', error);
                status.style.color = 'var(--danger)';
                status.textContent = error.message || 'Could not add that player.';
            } finally {
                button.disabled = false;
            }
        }

        async function loadRoster() {
            showStatus('Loading your roster...', 'info');

            try {
                const response = await fetch(`/api/roster/${hostPhone}`, {
                    headers: HostVerification.authHeaders()
                });
                if (response.status === 401) {
                    HostVerification.expireSession();
                    return;
                }
                if (!response.ok) throw new Error(`Server returned ${response.status}`);
                const data = await response.json();

                showStatus('', '');
                render(data.roster || []);
                document.getElementById('rosterBody').style.display = 'block';
            } catch (error) {
                console.error('Error loading roster:', error);
                showStatus('Could not load your roster. Please try again.', 'error');
            }
        }

        function render(roster) {
            document.getElementById('whichPhone').textContent = prettyPhone(hostPhone);
            document.getElementById('summaryLine').textContent = roster.length
                ? `${roster.length} ${roster.length === 1 ? 'person' : 'people'} you've played with.`
                : '';
            document.getElementById('emptyState').style.display = roster.length ? 'none' : 'block';
            if (!roster.length) fillEmptyRealistLine();

            const list = document.getElementById('rosterList');
            list.innerHTML = '';
            roster.forEach((player) => list.appendChild(rosterRow(player)));
        }

        // A Realist line for the empty state. Fail-silent, and empty until the surface
        // is enabled in the Developer Area, so a quiet API changes nothing here.
        function fillEmptyRealistLine() {
            const line = document.getElementById('emptyRealistLine');
            if (!line) return;
            fetch('/api/random-message?surface=empty-roster')
                .then((response) => (response.ok ? response.json() : null))
                .then((data) => {
                    const text = data && data.text ? String(data.text).trim() : '';
                    if (!text) return;
                    line.textContent = text;
                    line.style.display = 'block';
                })
                .catch(() => {});
        }

        function rosterRow(player) {
            const row = document.createElement('div');
            row.className = 'roster-row';

            // Built with the DOM rather than innerHTML so a name with an apostrophe or a
            // bracket in it cannot break the markup.
            const nameLabel = document.createElement('label');
            nameLabel.textContent = 'Name';
            const nameInput = document.createElement('input');
            nameInput.type = 'text';
            nameInput.value = player.name || '';
            nameLabel.appendChild(nameInput);

            const phone = document.createElement('div');
            phone.className = 'roster-phone';
            phone.textContent = prettyPhone(player.phone);

            const meta = document.createElement('div');
            meta.className = 'roster-meta';
            meta.textContent = player.gamesCount
                ? `${player.gamesCount} ${player.gamesCount === 1 ? 'game' : 'games'} with you`
                : 'Not in one of your games yet';

            const actions = document.createElement('div');
            actions.className = 'card-actions';
            const save = document.createElement('button');
            save.type = 'button';
            save.className = 'btn btn-primary';
            save.textContent = 'Save';
            actions.appendChild(save);

            const status = document.createElement('div');
            status.className = 'row-status';

            row.append(nameLabel, phone, meta, actions, status);

            save.addEventListener('click', async () => {
                status.style.color = 'var(--text-muted)';
                status.textContent = 'Saving...';
                save.disabled = true;

                try {
                    const response = await fetch(`/api/roster/${hostPhone}/${player.phone}`, {
                        method: 'PUT',
                        headers: HostVerification.authHeaders({ 'Content-Type': 'application/json' }),
                        body: JSON.stringify({
                            name: nameInput.value,
                            // DUPR is hidden from the page for now, but the stored values must
                            // ride along on every save or the server would blank them.
                            duprId: player.duprId || '',
                            duprRating: player.duprRating == null ? '' : player.duprRating
                        })
                    });
                    const data = await response.json().catch(() => ({}));
                    if (!response.ok) throw new Error(data.error || `Server returned ${response.status}`);

                    status.style.color = 'var(--brand)';
                    status.textContent = 'Saved.';
                } catch (error) {
                    console.error('Error saving roster entry:', error);
                    status.style.color = 'var(--danger)';
                    status.textContent = error.message || 'Could not save that.';
                } finally {
                    save.disabled = false;
                }
            });

            return row;
        }
    </script>

    <script src="/js/slogans.js"></script>
    <script src="/js/header.js"></script>
    <script src="/js/footer.js"></script>
</body>
</html>
