<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Games - IN or OUT</title>
    <!-- This page used to be "Find My Games": a separate phone lookup, needed because My Games
         could only show what happened to be in this browser's localStorage. My Games now looks
         games up by phone number itself, so the two pages became one.

         The file stays because texts and bookmarks from before still point here. Anyone
         following an old link lands on My Games rather than a dead page. -->
    <meta http-equiv="refresh" content="0; url=/my-games.html">
    <link rel="canonical" href="/my-games.html">
    <link rel="stylesheet" href="/css/design-system.css">
</head>
<body class="page-lookup">
    <main>
        <p>
        Finding your games...<br>
        <a href="/my-games.html">Continue to My Games</a>
        </p>
    </main>
    <script>
        // replace() rather than assigning href, so the back button does not land the user
        // here again and bounce them straight forward into a loop.
        window.location.replace('/my-games.html');
    </script>
</body>
</html>
