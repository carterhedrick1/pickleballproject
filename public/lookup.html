<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Find Your Games - In or Out</title>
    <link rel="stylesheet" href="/css/header.css">
    <link rel="stylesheet" href="/css/footer.css">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            line-height: 1.6;
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            min-height: 100vh;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 32px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.08);
        }
        .page-header {
            background: linear-gradient(135deg, #475569 0%, #429046 100%);
            color: white;
            padding: 20px 32px 16px;
            margin: -32px -32px 24px -32px;
            border-radius: 20px 20px 0 0;
        }
        .page-header h1 {
            font-size: 22px;
            font-weight: 600;
            margin: 0 0 4px 0;
        }
        .page-header p {
            font-size: 14px;
            opacity: 0.9;
            margin: 0;
        }
        .input-group {
            margin-bottom: 24px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #374151;
            font-size: 14px;
        }
        input[type="tel"] {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            font-size: 16px;
            box-sizing: border-box;
        }
        input[type="tel"]:focus {
            border-color: #429046;
            outline: none;
            box-shadow: 0 0 0 3px rgba(66, 144, 70, 0.1);
        }
        button {
            width: 100%;
            padding: 16px 28px;
            background: linear-gradient(135deg, #429046 0%, #16a34a 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 16px rgba(66, 144, 70, 0.3);
        }
        button:hover {
            background: linear-gradient(135deg, #16a34a 0%, #15803d 100%);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(66, 144, 70, 0.4);
        }
        .results {
            margin-top: 30px;
            padding: 20px;
            background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
            border-radius: 12px;
            border: 1px solid #e5e7eb;
        }
        .game-card {
            background: white;
            padding: 16px;
            margin-bottom: 16px;
            border-radius: 12px;
            border: 2px solid #e5e7eb;
            border-left: 4px solid #429046;
        }
        .game-card.cancelled {
            border-left-color: #ef4444;
            opacity: 0.7;
        }
        .game-title {
            font-weight: 600;
            margin-bottom: 8px;
            color: #1f2937;
        }
        .game-details {
            color: #6b7280;
            margin-bottom: 12px;
            font-size: 14px;
        }
        .management-link {
            background: linear-gradient(135deg, #429046 0%, #16a34a 100%);
            color: white;
            padding: 10px 18px;
            text-decoration: none;
            border-radius: 10px;
            display: inline-block;
            margin-top: 12px;
            font-weight: 600;
            font-size: 14px;
        }
        .management-link:hover {
            background: linear-gradient(135deg, #16a34a 0%, #15803d 100%);
        }
        .error {
            color: #991b1b;
            background: linear-gradient(135deg, #fee2e2 0%, #fecaca 100%);
            border: 1px solid #ef4444;
            padding: 16px;
            border-radius: 10px;
            margin-top: 20px;
        }
        .success {
            color: #166534;
            background: linear-gradient(135deg, #dcfce7 0%, #bbf7d0 100%);
            border: 1px solid #16a34a;
            padding: 16px;
            border-radius: 10px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="page-header">
            <h1>🎾 Find Your Pickleball Games</h1>
            <p>Enter your phone number to find all your hosted pickleball games and get management links.</p>
        </div>
        
        <div class="input-group">
            <label for="phone">Enter your phone number:</label>
            <input type="tel" id="phone" placeholder="(555) 123-4567" />
        </div>
        
        <button onclick="lookupGames()">Find My Games</button>
        
        <div id="results"></div>
    </div>

    <script>
        function formatPhoneForDisplay(phone) {
            const cleaned = phone.replace(/\D/g, '');
            if (cleaned.length === 10) {
                return `(${cleaned.slice(0,3)}) ${cleaned.slice(3,6)}-${cleaned.slice(6)}`;
            }
            return phone;
        }

        function formatDate(dateStr) {
            // Parse the date string manually to avoid timezone issues
            // dateStr format is "YYYY-MM-DD"
            const [year, month, day] = dateStr.split('-').map(num => parseInt(num));
            
            // Create date object and format manually to avoid any timezone confusion
            const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 
                          'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
            const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
            
            // Create the date in local time
            const date = new Date(year, month - 1, day);
            const dayName = days[date.getDay()];
            const monthName = months[date.getMonth()];
            
            return `${dayName}, ${monthName} ${day}`;
        }

        function formatTime(timeStr) {
            const [hours, minutes] = timeStr.split(':');
            const hour = parseInt(hours);
            const ampm = hour >= 12 ? 'PM' : 'AM';
            const displayHour = hour % 12 || 12;
            return `${displayHour}:${minutes} ${ampm}`;
        }

        async function lookupGames() {
            const phone = document.getElementById('phone').value.trim();
            const resultsDiv = document.getElementById('results');
            
            if (!phone) {
                resultsDiv.innerHTML = '<div class="error">Please enter a phone number.</div>';
                return;
            }
            
            resultsDiv.innerHTML = '<div>Looking up your games...</div>';
            
            try {
                const response = await fetch(`/api/games/by-phone/${encodeURIComponent(phone)}`);
                const data = await response.json();
                
                if (!response.ok) {
                    throw new Error(data.error || 'Failed to lookup games');
                }
                
                if (data.games.length === 0) {
                    resultsDiv.innerHTML = `
                        <div class="results">
                            <h3>No Games Found</h3>
                            <p>No recent or upcoming games found for ${formatPhoneForDisplay(data.phoneNumber)}.</p>
                        </div>
                    `;
                    return;
                }
                
                let html = `
                    <div class="results">
                        <h3>Found ${data.games.length} Game${data.games.length > 1 ? 's' : ''}</h3>
                        <p>For phone number: ${formatPhoneForDisplay(data.phoneNumber)}</p>
                `;
                
                data.games.forEach(game => {
                    const statusClass = game.cancelled ? 'cancelled' : '';
                    const statusText = game.cancelled ? ' (CANCELLED)' : ` (${game.playerCount}/${game.totalPlayers} players)`;
                    const courtText = game.courtNumber ? ` - ${game.courtNumber}` : '';
                    
                    html += `
                        <div class="game-card ${statusClass}">
                            <div class="game-title">${game.location}${courtText}${statusText}</div>
                            <div class="game-details">
                                ${formatDate(game.date)} at ${formatTime(game.time)}
                                ${game.waitlistCount > 0 ? ` • ${game.waitlistCount} on waitlist` : ''}
                            </div>
                            <a href="${game.managementLink}" class="management-link" target="_blank">
                                Manage This Game
                            </a>
                        </div>
                    `;
                });
                
                html += '</div>';
                resultsDiv.innerHTML = html;
                
            } catch (error) {
                resultsDiv.innerHTML = `<div class="error">Error: ${error.message}</div>`;
            }
        }

        async function sendSMSLinks() {
            const phone = document.getElementById('phone').value.trim();
            const resultsDiv = document.getElementById('results');
            
            if (!phone) {
                resultsDiv.innerHTML = '<div class="error">Please enter a phone number.</div>';
                return;
            }
            
            resultsDiv.innerHTML = '<div>Sending SMS with your game links...</div>';
            
            try {
                const response = await fetch('/api/games/lookup-and-notify', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        phone: phone,
                        sendSms: true
                    })
                });
                
                const data = await response.json();
                
                if (!response.ok) {
                    throw new Error(data.error || 'Failed to send SMS');
                }
                
                if (data.gamesFound === 0) {
                    resultsDiv.innerHTML = `
                        <div class="results">
                            <div class="error">No recent or upcoming games found for ${formatPhoneForDisplay(data.phoneNumber)}.</div>
                        </div>
                    `;
                } else if (data.smsResult && data.smsResult.success) {
                    resultsDiv.innerHTML = `
                        <div class="results">
                            <div class="success">
                                ✅ Text message sent to ${formatPhoneForDisplay(data.phoneNumber)} with your management link${data.gamesFound > 1 ? 's' : ''}!
                                <br><br>
                                Found ${data.gamesFound} game${data.gamesFound > 1 ? 's' : ''}.
                            </div>
                        </div>
                    `;
                } else {
                    resultsDiv.innerHTML = `
                        <div class="results">
                            <div class="error">
                                Found ${data.gamesFound} game${data.gamesFound > 1 ? 's' : ''}, but failed to send SMS. 
                                ${data.smsResult ? data.smsResult.error : 'Unknown error'}
                            </div>
                        </div>
                    `;
                }
                
            } catch (error) {
                resultsDiv.innerHTML = `<div class="error">Error: ${error.message}</div>`;
            }
        }

        // Allow Enter key to trigger lookup
        document.getElementById('phone').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                lookupGames();
            }
        });
    </script>
    <script src="/js/header.js"></script>
    <script src="/js/footer.js"></script>
</body>
</html>
