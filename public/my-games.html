<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Games - IN or OUT</title>
    <link rel="stylesheet" href="/css/header.css">
    <link rel="stylesheet" href="/css/footer.css">
    <link rel="stylesheet" href="/css/host-pages.css">
    <link rel="stylesheet" href="/css/design-system.css">
</head>
<body class="page-host page-my-games">
    <div class="container">
        <div class="page-header">
            <div class="header-content">
                <h1>My Games</h1>
            </div>
        </div>

        <div id="status" class="status" style="display: none;"></div>

        <div class="content-section">
            <!-- Shown until we know whose games to load. -->
            <div id="phoneGate" class="phone-gate" style="display: none;">
                <div id="phoneStep">
                    <h3>Verify Your Host Number</h3>
                    <p>We’ll text you a verification code.</p>
                    <input type="tel" id="phoneInput" placeholder="(555) 123-4567" autocomplete="tel">
                    <br>
                    <button type="button" class="btn btn-primary" id="sendCodeBtn">Send Verification Code</button>
                </div>
                <div id="codeStep" style="display: none;">
                    <h3>Enter Your Verification Code</h3>
                    <p id="codeHelp"></p>
                    <input type="text" id="codeInput" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="123456">
                    <br>
                    <button type="button" class="btn btn-primary" id="verifyCodeBtn">Verify And Continue</button>
                    <button type="button" class="switch-number" id="resendCodeBtn">Send A New Code</button>
                    <button type="button" class="switch-number" id="changeNumberBtn">Use A Different Number</button>
                </div>
            </div>

            <div id="gamesBody" style="display: none;">
                <p class="summary-line" id="summaryLine"></p>

                <!-- Nothing coming up, but a history of games: the next thing this host wants is
                     last week's game again. Filled in by my-games.js. -->
                <div id="runItAgainCard" class="run-again-card" hidden></div>

                <h3 class="section-subtitle" id="upcomingHeading">Upcoming Games</h3>
                <div id="upcomingList"></div>

                <details class="past-games" id="pastWrapper">
                    <summary id="pastSummary">Past Games</summary>
                    <div id="pastList"></div>
                </details>

                <div id="emptyState" class="no-games" style="display: none;">
                    <h3>No Games Yet</h3>
                    <p class="realist-line" id="emptyRealistLine" style="display: none;"></p>
                    <a href="/create.html" class="create-game-btn">Create A Game</a>
                </div>

                <p class="muted" style="margin-top: 28px;">
                    <span id="whichPhone"></span>
                    <button type="button" class="switch-number" id="switchNumber">Not You? Switch Number</button>
                    &middot;
                    <button type="button" class="switch-number" id="textMeLinks">Text Me My Links</button>
                </p>
            </div>
        </div>

    </div>

    <script type="module" src="/js/my-games.js"></script>
    <script src="/js/slogans.js"></script>
    <script src="/js/header.js"></script>
    <script src="/js/footer.js"></script>
</body>
</html>
